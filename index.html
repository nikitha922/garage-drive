<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Garage Drive</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div class="hud">
      <header class="top">
        <div class="brand">Garage<span>Drive</span></div>
        <div class="chips">
          <span id="mode">SPORT</span>
          <span id="cam">CHASE</span>
          <span id="fx">FX HIGH</span>
          <span id="mute">SOUND</span>
        </div>
      </header>

      <div class="drift" id="drift"></div>
      <div class="prompt" id="prompt"></div>

      <div class="paints"><span>Paint</span><div id="swatches"></div></div>

      <div class="dash">
        <div class="gear" id="gear">N</div>
        <div class="speed"><b id="speed">0</b><span>km/h</span></div>
        <div class="rpm"><i id="rpm"></i></div>
      </div>

      <div class="keys">
        <p><kbd>W</kbd><kbd>↑</kbd> gas · <kbd>S</kbd><kbd>↓</kbd> brake/reverse · <kbd>A</kbd><kbd>D</kbd> steer · <kbd>Space</kbd> handbrake (drift)</p>
        <p><kbd>C</kbd> camera · <kbd>T</kbd> mode · <kbd>L</kbd> lights · <kbd>U</kbd> underglow · <kbd>H</kbd> horn · <kbd>1-6</kbd> paint</p>
        <p><kbd>E</kbd> get out / in · <kbd>Q</kbd> quality · <kbd>M</kbd> sound · <kbd>R</kbd> reset · gamepad supported</p>
      </div>
    </div>

    <div class="touch" aria-hidden="true">
      <div class="pad left">
        <button data-key="a">◀</button>
        <button data-key="d">▶</button>
      </div>
      <div class="pad right">
        <button data-key=" ">DRIFT</button>
        <button data-key="s">BRAKE</button>
        <button data-key="w" class="go">GAS</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
